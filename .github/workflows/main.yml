name: MERN CI/CD Pipeline

on:
   push:
      branches:
         - deploy
   pull_request:
      branches:
         - deploy

jobs:
   check-changes:
      runs-on: ubuntu-latest
      outputs:
         backend_changes: ${{ steps.changes.outputs.backend }}
         frontend_changes: ${{ steps.changes.outputs.frontend }}
      steps:
         - name: Checkout code
           uses: actions/checkout@v4

         - name: Check for changes
           id: changes
           uses: dorny/paths-filter@v3
           with:
              base: HEAD~1
              filters: |
                 backend:
                   - 'backend/**'
                 frontend:
                   - 'frontend/**'

         - name: Debug outputs
           run: |
              echo "Backend changes: ${{ steps.changes.outputs.backend }}"
              echo "Frontend changes: ${{ steps.changes.outputs.frontend }}"
              echo "Changed files:"
              git diff --name-only HEAD~1 HEAD

   backend:
      needs: check-changes
      runs-on: ubuntu-latest
      if: ${{ needs.check-changes.outputs.backend_changes == 'true' }}
      steps:
         - name: Set up backend
           run: |
              echo "Setting up backend..."

   frontend:
      needs: check-changes
      runs-on: ubuntu-latest
      if: ${{ needs.check-changes.outputs.frontend_changes == 'true' }}
      steps:
         - name: Set up frontend
           run: echo "Setting up frontend..."
