name: MERN CI/CD Pipeline

on:
   push:
      branches:
         - deploy
   pull_request:
      branches:
         - deploy

jobs:
   check-changes:
      runs-on: ubuntu-latest
      outputs:
         backend_changed: ${{ steps.changes.outputs.backend }}
         frontend_changed: ${{ steps.changes.outputs.frontend }}
      steps:
         - name: Checkout Code
           uses: actions/checkout@v4
           with:
              fetch-depth: 0

         - name: Check for changes
           id: changes
           uses: dorny/paths-filter@v3
           with:
              filters: |
                 backend:
                   - 'backend/**'
                 frontend:
                   - 'frontend/**'

         - name: Debug outputs
           run: |
              echo "Raw backend output: '${{ steps.changes.outputs.backend }}'"
              echo "Raw frontend output: '${{ steps.changes.outputs.frontend }}'"
              echo "Backend changed: ${{ steps.changes.outputs.backend }}"
              echo "Frontend changed: ${{ steps.changes.outputs.frontend }}"
              echo "All changed files in this commit:"
              git diff --name-only HEAD~1 HEAD || echo "No previous commit to compare"
              echo "Files matching backend/** pattern:"
              git diff --name-only HEAD~1 HEAD | grep "^backend/" || echo "No backend files changed"
              echo "Files matching frontend/** pattern:"
              git diff --name-only HEAD~1 HEAD | grep "^frontend/" || echo "No frontend files changed"

   backend:
      runs-on: ubuntu-latest
      needs: check-changes
      if: ${{ needs.check-changes.outputs.backend_changed == 'true' }}
      steps:
         - name: Set up backend
           run: |
              echo "Setting up backend..."
              echo "Backend changed: ${{ needs.check-changes.outputs.backend_changed }}"
              echo "Frontend changed: ${{ needs.check-changes.outputs.frontend_changed }}"

   frontend:
      runs-on: ubuntu-latest
      needs: check-changes
      if: ${{ needs.check-changes.outputs.frontend_changed == 'true' }}
      steps:
         - name: Set up frontend
           run: |
              echo "Setting up frontend..."
              echo "Backend changed: ${{ needs.check-changes.outputs.backend_changed }}"
              echo "Frontend changed: ${{ needs.check-changes.outputs.frontend_changed }}"
