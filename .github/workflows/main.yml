name: MERN CI/CD Pipeline

on:
   push:
      branches:
         - deploy
   pull_request:
      branches:
         - deploy

jobs:
   check-changes:
      runs-on: ubuntu-latest
      outputs:
         backend_changed: ${{ steps.changes.outputs.backend }}
         frontend_changed: ${{ steps.changes.outputs.frontend }}
      steps:
         - name: Checkout Code
           uses: actions/checkout@v4
           with:
              fetch-depth: 0

         - name: Check for changes
           id: changes
           run: |
              # Get changed files
              CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD)
              echo "Changed files: $CHANGED_FILES"

              # Check for backend changes
              if echo "$CHANGED_FILES" | grep -q "^backend/"; then
                echo "backend=true" >> $GITHUB_OUTPUT
                echo "Backend changes detected"
              else
                echo "backend=false" >> $GITHUB_OUTPUT
                echo "No backend changes"
              fi

              # Check for frontend changes
              if echo "$CHANGED_FILES" | grep -q "^frontend/"; then
                echo "frontend=true" >> $GITHUB_OUTPUT
                echo "Frontend changes detected"
              else
                echo "frontend=false" >> $GITHUB_OUTPUT
                echo "No frontend changes"
              fi

   backend:
      runs-on: ubuntu-latest
      needs: check-changes
      if: ${{ needs.check-changes.outputs.backend_changed == 'true' }}
      steps:
         - name: Set up backend
           run: |
              echo "Setting up backend..."
              echo "Backend changed: ${{ needs.check-changes.outputs.backend_changed }}"
              echo "Frontend changed: ${{ needs.check-changes.outputs.frontend_changed }}"

   frontend:
      runs-on: ubuntu-latest
      needs: check-changes
      if: ${{ needs.check-changes.outputs.frontend_changed == 'true' }}
      steps:
         - name: Set up frontend
           run: |
              echo "Setting up frontend..."
              echo "Backend changed: ${{ needs.check-changes.outputs.backend_changed }}"
              echo "Frontend changed: ${{ needs.check-changes.outputs.frontend_changed }}"
              echo ${{toJson(needs.check-changes)}}
