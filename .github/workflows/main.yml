name: MERN CI/CD Pipeline

on:
   push:
      branches:
         - deploy
   pull_request:
      branches:
         - deploy

jobs:
   check-changes:
      runs-on: ubuntu-latest
      outputs:
         backend_changed: ${{ steps.changes.outputs.backend }}
         frontend_changed: ${{ steps.changes.outputs.frontend }}
      steps:
         - name: Checkout Code
           uses: actions/checkout@v4
           with:
              fetch-depth: 0

         - name: Check for changes
           id: changes
           run: |
              # Get changed files
              CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD)
              echo "Changed files: $CHANGED_FILES"

              # Check for backend changes
              if echo "$CHANGED_FILES" | grep -q "^backend/"; then
                echo "backend=true" >> $GITHUB_OUTPUT
                echo "Backend changes detected"
              else
                echo "backend=false" >> $GITHUB_OUTPUT
                echo "No backend changes"
              fi

              # Check for frontend changes
              if echo "$CHANGED_FILES" | grep -q "^frontend/"; then
                echo "frontend=true" >> $GITHUB_OUTPUT
                echo "Frontend changes detected"
              else
                echo "frontend=false" >> $GITHUB_OUTPUT
                echo "No frontend changes"
              fi

   backend:
      runs-on: ubuntu-latest
      needs: check-changes
      if: ${{ needs.check-changes.outputs.backend_changed == 'true' }}
      steps:
         - name: Checkout
           uses: actions/checkout@v4
           with:
              fetch-depth: 0

         - name: "Creating docker image"
           run: |
              cd backend
              docker build -t hozaifa4you/mern-cicd-backend .
              echo "Image build successful"

         - name: Pushing docker image
           env:
              DOCKER_USERNAME: ${{secrets.DOCKER_USERNAME}}
              DOCKER_PASSWORD: ${{secrets.DOCKER_PASSWORD}}
           run: |
              echo $DOCKER_PASSWORD | docker login -u $DOCKER_USERNAME --password-stdin
              docker push hozaifa4you/mern-cicd-backend
              docker logout
              echo "Docker image pushed successfully"

         - name: Server login & Deploy
           env:
              SERVER_USERNAME: ${{secrets.SERVER_USERNAME}}
              SERVER_PASSWORD: ${{secrets.SERVER_PASSWORD}}
              SERVER_HOST: ${{secrets.SERVER_HOST}}
           run: |
              apt-get update -y
              apt-get install sshpass
              sshpass -p $SERVER_PASSWORD ssh -o StrictHostKeyChecking=no $SERVER_USERNAME@$SERVER_HOST
              'sudo docker pull hozaifa4you/mern-cicd-backend &&
              cd /home/hozaifabinmasud/websites/mern-cicd &&
              sudo docker compose up -d --no-deps --build backend &&
              exit'

   frontend:
      runs-on: ubuntu-latest
      needs: check-changes
      if: ${{ needs.check-changes.outputs.frontend_changed == 'true' }}
      steps:
         - name: Checkout
           uses: actions/checkout@v4
           with:
              fetch-depth: 0

         - name: "Creating docker image"
           run: |
              cd frontend
              docker build -t hozaifa4you/mern-cicd-frontend .
              echo "Image build successful"

         - name: Pushing docker image
           env:
              DOCKER_USERNAME: ${{secrets.DOCKER_USERNAME}}
              DOCKER_PASSWORD: ${{secrets.DOCKER_PASSWORD}}
           run: |
              echo $DOCKER_PASSWORD | docker login -u $DOCKER_USERNAME --password-stdin
              docker push hozaifa4you/mern-cicd-frontend
              docker logout
              echo "Docker image pushed successfully"

         - name: Server login & Deploy
           env:
              SERVER_USERNAME: ${{secrets.SERVER_USERNAME}}
              SERVER_PASSWORD: ${{secrets.SERVER_PASSWORD}}
              SERVER_HOST: ${{secrets.SERVER_HOST}}
           run: |
              apt-get update -y
              apt-get install sshpass
              sshpass -p $SERVER_PASSWORD ssh -o StrictHostKeyChecking=no $SERVER_USERNAME@$SERVER_HOST
              'sudo docker pull hozaifa4you/mern-cicd-frontend &&
              cd /home/hozaifabinmasud/websites/mern-cicd &&
              sudo docker compose up -d --no-deps --build frontend &&
              exit'
